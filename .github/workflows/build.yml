name: Build Multi-Platform MotionFX

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. 1.0.0)'
        required: false
        default: '1.0.0'

permissions:
  contents: write

jobs:
  # ==========================================================================
  # 1. WINDOWS BUILD (.exe installer + .zip)
  # ==========================================================================
  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout MotionFX
        uses: actions/checkout@v4

      - name: Checkout OBS headers (shallow sparse)
        shell: bash
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/obsproject/obs-studio.git obs-repo
          cd obs-repo
          git sparse-checkout set libobs
          cp ../include/obsconfig.h libobs/obsconfig.h 2>/dev/null || true

      - name: Setup MSYS2 MinGW-w64 C++20
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-binutils

      - name: Generate libobs import library
        shell: msys2 {0}
        run: |
          dlltool -d cmake/obs.def -l cmake/libobs.a

      - name: Compile motionfx.dll
        shell: msys2 {0}
        run: |
          mkdir -p build
          g++ -shared -std=c++20 -DOBS_PLUGIN_BUILD=1 -O2 \
              src/motionfx_plugin.cpp \
              src/motionfx_easing.cpp \
              src/motionfx_timeline.cpp \
              src/motionfx_tracks.cpp \
              src/motionfx_engine.cpp \
              src/motionfx_3d.cpp \
              src/motionfx_effects.cpp \
              src/motionfx_presets.cpp \
              src/motionfx_dispatcher.cpp \
              -Iinclude -Iobs-repo/libobs \
              cmake/libobs.a \
              -o build/motionfx.dll \
              -static-libgcc -static-libstdc++ \
              -Wl,-Bstatic -lwinpthread -Wl,-Bdynamic

      - name: Stage Windows Distribution Files
        shell: bash
        run: |
          mkdir -p staging/obs-plugins/64bit staging/data/obs-plugins/motionfx/locale
          cp build/motionfx.dll staging/obs-plugins/64bit/
          cp data/motionfx_3d.effect staging/data/obs-plugins/motionfx/
          cp data/locale/*.ini staging/data/obs-plugins/motionfx/locale/
          cp README.md LICENSE staging/

      - name: Build Inno Setup Installer (.exe)
        shell: pwsh
        run: |
          $inno = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $inno)) {
              choco install innosetup --no-progress -y
              $inno = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          New-Item -ItemType Directory -Force -Path artifacts
          & $inno /Oartifacts installer/windows/motionfx_installer.iss

      - name: Build Portable Windows ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path staging/* -DestinationPath artifacts/MotionFX-v1.0.0-Windows-x64.zip

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MotionFX-Windows
          path: artifacts/*

  # ==========================================================================
  # 2. LINUX BUILD (.deb + .tar.gz + .zip)
  # ==========================================================================
  build-linux:
    name: Build Linux (x64)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout MotionFX
        uses: actions/checkout@v4

      - name: Install dependencies
        timeout-minutes: 5
        run: |
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout="20"
          sudo apt-get install -y --no-install-recommends libobs-dev build-essential cmake zip

      - name: Checkout OBS headers (fallback/ensure complete headers)
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/obsproject/obs-studio.git obs-repo
          cd obs-repo
          git sparse-checkout set libobs
          cp ../include/obsconfig.h libobs/obsconfig.h 2>/dev/null || true

      - name: Build Linux Shared Object
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release

      - name: Package Linux (.deb, .tar.gz, .zip)
        run: |
          chmod +x installer/linux/build_deb.sh
          ./installer/linux/build_deb.sh 1.0.0 artifacts build

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MotionFX-Linux
          path: artifacts/*

  # ==========================================================================
  # 3. MACOS BUILD (Universal: arm64 + x86_64, .pkg installer + .zip)
  # ==========================================================================
  build-macos:
    name: Build macOS (Universal)
    runs-on: macos-latest
    steps:
      - name: Checkout MotionFX
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install simde

      - name: Checkout OBS headers (shallow sparse)
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/obsproject/obs-studio.git obs-repo
          cd obs-repo
          git sparse-checkout set libobs
          cp ../include/obsconfig.h libobs/obsconfig.h 2>/dev/null || true

      - name: Build macOS Plugin (Universal Binary)
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          cmake --build build --config Release

      - name: Package macOS (.pkg, .zip)
        run: |
          chmod +x installer/macos/build_pkg.sh
          ./installer/macos/build_pkg.sh 1.0.0 artifacts build

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MotionFX-macOS
          path: artifacts/*

  # ==========================================================================
  # 4. RELEASE DISPATCH / GITHUB RELEASE (All Platforms)
  # ==========================================================================
  release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux, build-macos]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
          merge-multiple: true

      - name: Display downloaded assets
        run: |
          ls -la all-artifacts/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.version || 'v1.0.0' }}
          name: MotionFX ${{ github.ref_name || inputs.version || 'v1.0.0' }}
          body: |
            ## MotionFX: Advanced Animation & 3D Transition Engine for OBS Studio

            ### Multi-Platform Release Assets:
            - **Windows (x64)**:
              - `MotionFX-v1.0.0-Windows-Installer.exe` (Automatic Installer)
              - `MotionFX-v1.0.0-Windows-x64.zip` (Portable Archive)
            - **Linux (x64)**:
              - `MotionFX-v1.0.0-Linux-x64.deb` (Debian / Ubuntu Package)
              - `MotionFX-v1.0.0-Linux-x64.tar.gz` (Portable Tarball)
              - `MotionFX-v1.0.0-Linux-x64.zip` (Portable Zip)
            - **macOS (Universal: Apple Silicon & Intel)**:
              - `MotionFX-v1.0.0-macOS.pkg` (macOS Native Installer)
              - `MotionFX-v1.0.0-macOS.zip` (Plug-and-play `.plugin` bundle)

            ### Highlights:
            - Native OBS Scene Item Show / Hide transition integration (OBS_SOURCE_TYPE_TRANSITION).
            - 15+ built-in presets: 3D Flip X/Y/Diagonal, Perspective Tilt, Zoom Spin, Blur Focus, Glitch, Cinematic Fly-Through, Elastic Pop, etc.
            - Full bilingual support (English & Vietnamese).
          files: all-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
